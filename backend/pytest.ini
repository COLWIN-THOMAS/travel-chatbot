[pytest]
# Without this, pytest's default collection scans the whole backend/ tree, including
# scripts/load_test.py - which matches the default "*_test.py" glob and gets imported as a test
# module purely because of its filename. Importing it pulls in Locust's gevent monkey-patch,
# which silently corrupts the process's ssl/socket state for everything imported afterward
# (confirmed via the gevent MonkeyPatchWarning) and caused every DB-using test after that point
# to hang indefinitely on an established-but-unresponsive connection. Restricting collection to
# tests/ avoids this entire class of bug, not just this one file.
testpaths = tests
